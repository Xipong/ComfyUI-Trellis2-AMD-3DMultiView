name: AMD integration CPU tests
on:
  push:
    branches: [main, amd-multiview-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/wheels/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependency (not the ROCm runtime)
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Python source
        run: python -m compileall -q -x "[/\\\\](wheels|\\.git)[/\\\\]" .
      - name: Regression tests
        run: python -m unittest discover -s tests -v
